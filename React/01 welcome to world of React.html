<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <h1>hello</h1>

    <div id="root">

        <script>
           
            const root = document.querySelector("#root")
 //to create a react element (react element is a javascript object)
            // React.creareElement()  //tag,props(attributes),children

            const h2 = React.createElement("h2",{},"hello react")

          // for rendering the react element we need a starting position

          ReactDOM.createRoot(root).render(h2)
        </script>
    </div>
</body>
</html>
